async function load(){let r=await fetch("/api/data",{headers:hd()});if(r.status==401){pin=prompt("PIN:")||"";localStorage.pin=pin;return load()}D=await r.json();D.w=D.w||[];D.s=D.s||[];D.c=D.c||[];D.h=D.h||0;D.f=D.f||{};D.a=D.a||{};D.g=D.g||null;Object.keys(D.a).forEach(k=>{if(/^(Błąd|…)/.test(D.a[k]))delete D.a[k]});if(!init){init=1;day=pickDay()}render()}

const fmt=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function adj(id,d){const e=$("#"+id);e.value=Math.max(0,Math.round(((+e.value||0)+d)*10)/10)}
function trend(){return D.w.map(x=>{const a=D.w.filter(z=>z.d<=x.d&&(new Date(x.d)-new Date(z.d))<7*864e5);return a.reduce((t,z)=>t+z.kg,0)/a.length})}
function tk(){const wk=new Set(D.s.filter(x=>x.d>ds(7)).map(x=>x.d)).size,w=D.w.at(-1);return(`★ DZIŚ: TRENING ${day} ★ OSTATNIE 7 DNI: ${wk} TRENINGÓW ★ ${w?"WAGA "+w.kg+" KG":"ZAPISZ WAGĘ"} ★ KAŻDA SERIA SIĘ LICZY `).repeat(2)}
function setG(){const kg=+$("#gk").value;if(!kg)return;D.g={kg,d:$("#gd").value||"",s:(D.g&&D.g.kg==kg&&D.g.s)||(D.w.at(-1)&&D.w.at(-1).kg)||kg};save();render()}
function goalCard(){const g=D.g,tr=trend(),l=D.w.at(-1);let t=`<div class="row"><input id="gk" type="number" step="0.1" inputmode="decimal" placeholder="cel (kg)" value="${g?g.kg:""}"><input id="gd" type="date" value="${g?g.d:""}"></div><button class="b" onclick="setG()">ZAPISZ CEL</button>`;
if(g&&l&&tr.length){const now=tr.at(-1),tot=g.s-g.kg,pc=tot>0?Math.max(0,Math.min(100,(g.s-now)/tot*100)):0,oi=D.w.map(x=>x.d).findLastIndex(d=>d<=ds(7));let rate=null;if(oi>=0)rate=(now-tr[oi])/((new Date(l.d)-new Date(D.w[oi].d))/6048e5);
t+=`<div class="bar"><i style="width:${pc.toFixed(0)}%"></i></div><p class="goal">Start ${g.s} kg → cel ${g.kg} kg (trend teraz ${now.toFixed(1)} kg, ${pc.toFixed(0)}%)</p>`;
if(rate===null)t+='<p class="m">Tempo spadku pojawi się po min. 7 dniach pomiarów.</p>';else{t+=`<p class="m">Tempo (trend): <b>${rate>0?"+":""}${rate.toFixed(2)} kg/tydz.</b></p>`;
if(rate<-0.01*l.kg)t+='<p class="up">Chudniesz szybko (ponad 1% masy ciała tygodniowo). Przy treningu siłowym łatwo wtedy tracić mięśnie.</p>';else if(now>g.kg&&rate>=0)t+='<p class="up">Trend nie spada. Sprawdź dietę i regularność pomiarów.</p>'}
if(g.d&&now>g.kg){const dl=Math.ceil((new Date(g.d)-new Date(today()))/864e5);if(dl>0){const need=(now-g.kg)/(dl/7);t+=`<p class="m">Do ${g.d}: ${dl} dni, potrzebne tempo ok. <b>${need.toFixed(2)} kg/tydz.</b>${need>0.01*l.kg?" To bardzo ambitny termin.":""}</p>`}else t+='<p class="m">Termin minął. Ustaw nowy.</p>'}}
return`<div class="card"><h3>Cel wagowy</h3>${t}</div>`}
function bak(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="silownia-kopia-"+today()+".json";a.click()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.s)||!Array.isArray(j.w)||!Array.isArray(j.c))throw 0;if(!confirm("Zastąpić wszystkie dane z aplikacji danymi z pliku?"))return;D=j;D.h=D.h||0;D.f=D.f||{};D.a=D.a||{};D.g=D.g||null;saveNow().then(render)}catch(e){alert("To nie jest poprawny plik kopii.")}};r.readAsText(f)}
async function analyze(d){busy=d;err="";render();const nx=nextPlan(d);try{const r=await fetch("/api/analyze",{method:"POST",headers:hd(),body:JSON.stringify({d,next:nx,plan:PLAN[nx].join(", ")})}),j=await r.json();if(j.text){D.a[d]=j.text;D.t=Date.now()}else err="Błąd analizy: "+(j.error||r.status)}catch(e){err="Błąd połączenia z analizą."}busy=null;save();render()}

async function finish(){D.f[today()]=Date.now();render();try{await saveNow()}catch(e){}analyze(today())}
function sumCard(d){const s=D.s.filter(x=>x.d==d),ids=s.map(x=>x.id).filter(Boolean),min=ids.length>1?Math.max(1,Math.round((Math.max(...ids)-Math.min(...ids))/6e4)):0,vol=Math.round(s.reduce((t,x)=>t+x.kg*x.r,0)),ex=[...new Set(s.map(x=>x.ex))],pr=ex.filter(e=>EX[e]&&EX[e].st&&D.s.some(z=>z.ex==e&&z.d<d)&&Math.max(...s.filter(z=>z.ex==e).map(z=>z.kg))>Math.max(...D.s.filter(z=>z.ex==e&&z.d<d).map(z=>z.kg)));
return`<div class="card${pr.length?" pr":""}"><h3>Podsumowanie treningu</h3><ul><li>Czas: <b>${min?min+" min":"–"}</b></li><li>Ćwiczeń: <b>${ex.length}</b>, serii: <b>${s.length}</b></li><li>Objętość: <b>${vol}</b> kg × powt.</li>${pr.length?`<li class="up">★ Nowy rekord ciężaru: ${pr.join(", ")}</li>`:""}</ul></div>`}
function aiCard(d){const a=D.a[d];if(!a&&busy!=d&&!err)return"";return`<div class="card"><h3>Analiza trenera AI</h3><div style="white-space:pre-wrap">${busy==d?"Analizuję Twoje wyniki…":a?fmt(a):err}</div>${!a&&busy!=d?`<button class="b" onclick="analyze('${d}')">SPRÓBUJ PONOWNIE</button>`:""}</div>`}

function finBlock(){const d=today();if(!D.s.some(x=>x.d==d))return"";return D.f[d]?sumCard(d)+aiCard(d):'<button class="b" onclick="finish()">ZAKOŃCZ TRENING</button>'}
function home(){const wk=new Set(D.s.filter(x=>x.d>ds(7)).map(x=>x.d)).size,T=4,C=2*Math.PI*34,pc=Math.min(1,wk/T),tr=trend(),w=D.w.at(-1),done=D.s.some(x=>x.d==today());
const ring=`<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="#24402f" stroke-width="8"/><circle cx="40" cy="40" r="34" fill="none" stroke="#2fbf4a" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(C*pc).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 40 40)"/><text x="40" y="47" text-anchor="middle" fill="#e8f2ea" font-size="22" font-family="Bebas Neue,Impact,sans-serif">${wk}/${T}</text></svg>`;
return`<div class="card hero"><div class="top"><div><small>DZIŚ</small><h2>TRENING ${day}</h2><small>${PLAN[day].length} ćwiczeń · cel tygodnia: ${T} treningi</small></div>${ring}</div><button class="b" onclick="tab='t';render()">${done?"WRÓĆ DO TRENINGU":"ZACZNIJ TRENING"}</button></div>`+aiHome()+(w?`<div class="card"><h3>Waga</h3><div class="goal">${w.kg} kg · trend ${tr.at(-1).toFixed(1)} kg</div></div>`:"")+report()}
const MS={legpress:["quad","glute"],chest:["chest","delt","tricep"],pulldown:["back","bicep"],shoulder:["delt","tricep"],legcurl:["ham"],crunch:["abs"],legext:["quad"],row:["back","bicep","rdelt"],fly:["chest"],rearfly:["rdelt","back"],curl:["bicep"],triceps:["tricep"],abduct:["glute"],backext:["lback","glute"],plank:["abs"]};
const MN2={quad:"czworogłowe ud",glute:"pośladki",chest:"klatka piersiowa",delt:"przednie barki",tricep:"triceps",back:"plecy",bicep:"biceps",ham:"dwugłowe ud",abs:"brzuch",rdelt:"tylne barki",lback:"dolny odcinek pleców"};
const BM=[["e","calf",18,100,4,8],["e","calf",32,100,4,8],["e","quad",19,75,7,15],["e","quad",31,75,7,15],["e","delt",11,24,5,6],["e","delt",39,24,5,6],["e","chest",19,31,7,6],["e","chest",31,31,7,6],["r","abs",19,39,12,19,3],["e","bicep",7,36,3.5,8],["e","bicep",43,36,3.5,8],
["e","rdelt",71,24,5,6],["e","rdelt",99,24,5,6],["r","back",76,27,18,22,4],["r","lback",79,50,12,9,2],["e","tricep",67,36,3.5,8],["e","tricep",103,36,3.5,8],["e","ham",79,77,6,13],["e","ham",91,77,6,13],["e","glute",79,66,6,6],["e","glute",91,66,6,6],["e","calf",78,100,4,8],["e","calf",92,100,4,8]];
function mmap(k){const ks=MS[k]||[],c=m=>ks.includes(m)?"#ffd400":"#2a4a37",B='<circle cx="25" cy="8" r="6"/><rect x="14" y="18" width="22" height="44" rx="8"/><ellipse cx="6" cy="52" rx="3" ry="8"/><ellipse cx="44" cy="52" rx="3" ry="8"/><circle cx="85" cy="8" r="6"/><rect x="74" y="18" width="22" height="44" rx="8"/><ellipse cx="66" cy="52" rx="3" ry="8"/><ellipse cx="104" cy="52" rx="3" ry="8"/>';
return`<svg class="mm" viewBox="0 -2 110 112"><g fill="#17301f">${B}</g>`+BM.map(m=>m[0]=="e"?`<ellipse cx="${m[2]}" cy="${m[3]}" rx="${m[4]}" ry="${m[5]}" fill="${c(m[1])}"/>`:`<rect x="${m[2]}" y="${m[3]}" width="${m[4]}" height="${m[5]}" rx="${m[6]}" fill="${c(m[1])}"/>`).join("")+"</svg>"}
function lastDate(){return D.s.length?D.s.map(x=>x.d).sort().pop():null}
function nextPlan(L){const ks=Object.keys(PLAN);return L==today()?ks[(ks.indexOf(day)+1)%ks.length]:day}
function refreshAI(){const L=lastDate();if(!L||busy)return;analyze(L)}
function aiHome(){const L=lastDate(),a=L&&D.a[L],ld=busy&&busy==L;
const body=!L?"Zrób pierwszy trening, a tu pojawi się analiza Twoich wyników.":ld?"Analizuję Twoje wyniki…":a?fmt(a):(err||"Brak analizy ostatniego treningu. Kliknij ODŚWIEŻ.");
const when=a&&D.t&&!ld?`<small>Trening z ${L} · wygenerowano ${new Date(D.t).toLocaleString("pl-PL",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"})}</small>`:"";
return`<div class="card"><h3>Analiza trenera AI</h3>${when}<div style="white-space:pre-wrap;margin:6px 0">${body}</div>${a&&err&&!ld?`<p class="up">${err}</p>`:""}${L?`<button class="b" onclick="refreshAI()"${ld?" disabled":""}>↻ ${ld?"ANALIZUJĘ…":"ODŚWIEŻ ANALIZĘ"}</button>`:""}</div>`}
function cal(){const n=new Date(),b=new Date(n.getFullYear(),n.getMonth()+cmo,1),y=b.getFullYear(),m=b.getMonth(),dim=new Date(y,m+1,0).getDate(),off=(b.getDay()+6)%7,pad=x=>String(x).padStart(2,"0"),pre=y+"-"+pad(m+1),sd=new Set(D.s.map(x=>x.d)),vm=D.s.reduce((o,x)=>(o[x.d]=(o[x.d]||0)+x.kg*x.r,o),{}),mxv=Math.max(1,...Object.values(vm)),cd=new Set(D.c.map(x=>x.d)),MN=["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"],s=sel||today();
let g=["Pn","Wt","Śr","Cz","Pt","So","Nd"].map(x=>`<div class="dh">${x}</div>`).join("")+"<div></div>".repeat(off);
for(let d=1;d<=dim;d++){const k=pre+"-"+pad(d);g+=`<div class="dy${sd.has(k)?" tr":""}${k==today()?" td":""}${k==s?" sl":""}"${sd.has(k)?` style="background:rgba(47,191,74,${(.3+.7*(vm[k]||0)/mxv).toFixed(2)})"`:""} onclick="sel='${k}';render()">${d}${cd.has(k)?"<i></i>":""}</div>`}
const cnt=[...sd].filter(d=>d.startsWith(pre)).length,by={};D.s.filter(x=>x.d==s).forEach(x=>(by[x.ex]=by[x.ex]||[]).push(x));
const det=Object.keys(by).map(e=>`<div style="margin:6px 0"><b>${e}</b><br><span class="m">${by[e].map(x=>x.kg+" kg × "+x.r).join(" · ")}</span></div>`).join("")+D.c.filter(x=>x.d==s).map(x=>`<div style="margin:6px 0">${x.m}: ${x.min} min${x.spd?", "+x.spd+" km/h":""}${x.inc?", nachyl. "+x.inc:""}</div>`).join("")+D.w.filter(x=>x.d==s).map(x=>`<div style="margin:6px 0">Waga: ${x.kg} kg</div>`).join("");
return`<div class="mh"><button class="b" onclick="cmo--;render()">◀</button><b>${MN[m]} ${y}</b><button class="b" onclick="cmo++;render()">▶</button></div><div class="cal">${g}</div><p class="m">Zielone dni: trening siłowy. Żółta kropka: cardio.</p><div class="card"><h3>Statystyki treningów</h3><div class="set"><span>${MN[m]} ${y}</span><b>${cnt}</b></div><div class="set"><span>Rok ${y}</span><b>${[...sd].filter(d=>d.startsWith(y+"-")).length}</b></div><div class="set"><span>Łącznie</span><b>${sd.size}</b></div><div class="set"><span>Dni z cardio w miesiącu</span><b>${[...cd].filter(d=>d.startsWith(pre)).length}</b></div></div><div class="card"><h3>${s}</h3>${det||'<p class="m">Brak wpisów tego dnia.</p>'}${D.a[s]&&D.a[s]!="…"?'<h3 style="margin-top:10px">Analiza AI</h3><div style="white-space:pre-wrap">'+fmt(D.a[s])+'</div>':""}</div>`}
function render(){const v=$("#v");let h="";
if(tab=="t"){h=`<div class="days">${Object.keys(PLAN).map(k=>`<button class="${k==day?"on":""}" onclick="day='${k}';render()">TRENING ${k}</button>`).join("")}</div>`+PLAN[day].map((e,i)=>{const x=EX[e],t=D.s.filter(z=>z.ex==e&&z.d==today()),tg=target(e),dk=t.at(-1)?.kg??(tg?tg.kg:""),dr=t.at(-1)?.r??(tg?tg.r:"");
return`<div class="card"><div class="top"><div class="vis">${fig(x.k)}${mmap(x.k)}</div><div><h3>${e}</h3><div class="goal">${goal(e)}</div><div class="cue">${x.c}</div><div class="cue">Pracują: <b>${[...new Set((MS[x.k]||[]).map(m=>MN2[m]))].join(", ")}</b></div></div></div>${t.map(z=>`<div class="set"><span>${z.kg} kg × ${z.r}</span><a onclick="del('s',${z.id})">✕</a></div>`).join("")}<div class="row"><div class="sp"><button onclick="adj('k${i}',-${x.st||2.5})">−</button><input id="k${i}" type="number" step="0.5" inputmode="decimal" placeholder="kg" value="${dk}"><button onclick="adj('k${i}',${x.st||2.5})">+</button></div><div class="sp"><button onclick="adj('r${i}',-1)">−</button><input id="r${i}" type="number" inputmode="numeric" placeholder="powt." value="${dr}"><button onclick="adj('r${i}',1)">+</button></div></div><button class="b" onclick="addSet(${i})">+ SERIA (powtórz ostatnią)</button></div>`}).join("")}
if(tab=="t")h+=finBlock();if(tab=="d")h=home();if(tab=="k")h=cal();
if(tab=="w"){h=bmiCard()+goalCard()+`<div class="card"><h3>Waga ciała</h3><div class="row"><input id="wd" type="date" value="${today()}"><input id="wk" type="number" step="0.1" inputmode="decimal" placeholder="kg"></div><button class="b" onclick="addW()">ZAPISZ</button></div><div class="card">${chart(D.w.map(x=>[x.d,x.kg]),"kg",trend())}<p class="m">Zielone: waga. Żółte: trend (średnia z 7 dni).</p></div>`+D.w.slice().reverse().slice(0,15).map(x=>`<div class="set"><span>${x.d}: ${x.kg} kg${D.h?" · BMI "+bmiOf(x.kg).toFixed(1):""}</span><a onclick="del('w',${x.id})">✕</a></div>`).join("")}
if(tab=="c"){h=`<div class="card"><h3>Cardio</h3><select id="cm">${CARDIO.map(c=>`<option>${c}</option>`).join("")}</select><div class="row"><input id="cmin" type="number" inputmode="numeric" placeholder="czas (min)"><input id="cs" type="number" step="0.1" inputmode="decimal" placeholder="prędkość"><input id="ci" type="number" step="0.5" inputmode="decimal" placeholder="nachylenie"></div><button class="b" onclick="addC()">ZAPISZ</button></div>`+D.c.slice().reverse().slice(0,20).map(x=>`<div class="set"><span>${x.d} ${x.m}: ${x.min} min${x.spd?", "+x.spd+" km/h":""}${x.inc?", nachyl. "+x.inc:""}</span><a onclick="del('c',${x.id})">✕</a></div>`).join("")}
if(tab=="g"){const by={};D.s.filter(x=>x.ex==ex).forEach(x=>by[x.d]=Math.max(by[x.d]||0,x.kg));h=`<div class="card"><h3>Ciężar w czasie</h3><select onchange="ex=this.value;render()">${ALL.map(e=>`<option ${e==ex?"selected":""}>${e}</option>`).join("")}</select><p class="m">Najcięższa seria danego dnia</p>${chart(Object.keys(by).sort().map(d=>[d,by[d]]),"kg")}</div><div class="card"><h3>Waga ciała</h3>${chart(D.w.map(x=>[x.d,x.kg]),"kg")}</div><div class="row"><button class="b" onclick="exp()">CSV</button><button class="b" onclick="bak()">KOPIA JSON</button><button class="b" onclick="$('#imp').click()">IMPORT</button></div><input id="imp" type="file" accept=".json" style="display:none" onchange="imp(this)">`}
v.innerHTML=h;$("#tk").textContent=tk();$("#n").innerHTML=[["d","DZIŚ"],["t","TRENING"],["k","KALENDARZ"],["w","WAGA"],["c","CARDIO"],["g","WYKRESY"]].map(([k,l])=>`<button class="${k==tab?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("")}
function exp(){const r=["typ,data,nazwa,kg,powt,czas,predkosc,nachylenie",...D.s.map(x=>`sila,${x.d},"${x.ex}",${x.kg},${x.r},,,`),...D.w.map(x=>`waga,${x.d},,${x.kg},,,,`),...D.c.map(x=>`cardio,${x.d},${x.m},,,${x.min},${x.spd},${x.inc}`)].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r],{type:"text/csv"}));a.download="silownia.csv";a.click()}
render();load();
</script></body></html>
